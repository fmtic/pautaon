<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Temporariamente Indisponível</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --danger-color: #ef4444;
            --warning-bg: #fef2f2;
            --warning-border: #fecaca;
            --warning-text: #991b1b;
            --text-color: #1f2937;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --muted-text: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        /* Logo do Sistema */
        .system-logo {
            margin-bottom: 1.5rem;
        }

        .system-logo img {
            max-width: 170px;
            height: auto;
        }

        /* Ícone de Alerta */
        .icon-container {
            width: 72px;
            height: 72px;
            background-color: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            color: var(--danger-color);
        }

        .icon-container svg {
            width: 36px;
            height: 36px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }

        p {
            color: var(--muted-text);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .info-box {
            background-color: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.825rem;
            color: #475569;
            text-align: left;
        }

        .info-box-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .info-box-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #334155;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--muted-text);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background-color: #f1f5f9;
            color: var(--text-color);
        }

        .footer-note {
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Marca da Empresa Desenvolvedora */
        .company-branding {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .company-branding span {
            font-size: 0.725rem;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .company-branding img {
            max-width: 100px;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo do Sistema (PautaOn) -->
        <div class="system-logo">
            <img src="../static/img/logo_textual_transparente.png" alt="PautaOn Logo" onerror="this.style.display='none'">
        </div>

        <!-- Ícone Alerta / Problema Técnico -->
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <div class="status-badge">
            <span class="dot"></span>
            Instabilidade Temporária
        </div>

        <h1>Estamos enfrentando problemas técnicos</h1>

        <div class="actions">
            <button onclick="window.location.reload();" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Tentar Novamente
            </button>
            <a href="https://sos.grael.org.br" class="btn btn-outline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Contatar Suporte
            </a>
        </div>

        <!-- Marca da Empresa (FMtic) -->
        <div class="company-branding">
            <span>Desenvolvido por</span>
            <span>FMtic - Transformamos tecnologia em soluções inteligentes</span>
        </div>
    </div>

</body>
</html>
