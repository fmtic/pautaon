{% extends 'base.html' %}

{% block content %}
<div class="d-flex align-items-center justify-content-center h-100 p-4" style="min-height: 75vh;">
    <div class="card shadow-sm border-0" style="max-width: 520px; width: 100%; border-radius: 16px;">
        <div class="card-body text-center p-5">
            
            <!-- Ícone de Acesso Negado -->
            <div class="d-flex align-items-center justify-content-center mx-auto mb-4" 
                 style="width: 72px; height: 72px; background-color: #fef2f2; border-radius: 50%; color: #ef4444;">
                <i class="bi bi-shield-lock-fill" style="font-size: 2.5rem;"></i>
            </div>
            
            <!-- Badge de Status -->
            <div class="d-inline-flex align-items-center gap-2 mb-4 px-3 py-1 rounded-pill" 
                 style="background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 0.85rem; font-weight: 600;">
                <span style="width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; display: inline-block;"></span>
                Erro 403 - Acesso Negado
            </div>

            <!-- Mensagem Principal -->
            <h1 class="h4 fw-bold text-dark mb-3">Você não tem permissão</h1>
            <p class="text-muted mb-4" style="font-size: 0.95rem; line-height: 1.6;">
                Desculpe, mas o seu perfil de acesso atual não possui os privilégios necessários para visualizar esta página ou executar esta ação no sistema.
            </p>

            <!-- Ações -->
            <div class="d-flex flex-column gap-3 mt-2">
                <a href="{{ url_for('main.painel') }}" class="btn btn-primary fw-semibold py-2 d-flex align-items-center justify-content-center gap-2" style="border-radius: 8px;">
                    <i class="bi bi-arrow-left"></i> Voltar ao Painel Geral
                </a>
                <a href="https://sos.grael.org.br" target="_blank" class="btn btn-outline-secondary fw-semibold py-2 d-flex align-items-center justify-content-center gap-2" style="border-radius: 8px;">
                    <i class="bi bi-headset"></i> Contatar Suporte
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
