{% extends "base.html" %} {% block title %}Central de BI{% endblock %} {% block
content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">Central de BI</h1>
      <p class="text-muted mb-0">Indicadores e relatórios acadêmicos</p>
    </div>

    <div class="d-flex gap-2">
      <a
        href="{{ url_for('relatorios.relatorio_alunos') }}"
        class="btn btn-outline-secondary"
      >
        Relatório detalhado
      </a>
    </div>
  </div>

  <!-- Seleção do indicador -->
  <div class="card shadow-sm mb-4">
    <div class="card-header">
      <strong>Indicador</strong>
    </div>

    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="indicador" class="form-label"> Indicador </label>

          <select id="indicador" class="form-select">
            <option value="">Selecione um indicador</option>

            {% for categoria, itens in categorias.items() %}
            <optgroup label="{{ categoria|capitalize }}">
              {% for codigo, indicador in itens %}
              <option value="{{ codigo }}">
                {{ codigo }} — {{ indicador["nome"] }}
              </option>
              {% endfor %}
            </optgroup>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6 d-flex align-items-end">
          <button type="button" id="btnExecutar" class="btn btn-primary">
            Executar indicador
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Informações do indicador -->
  <div id="informacoesIndicador" class="card shadow-sm mb-4 d-none">
    <div class="card-header">
      <strong>Informações do indicador</strong>
    </div>

    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <small class="text-muted d-block">Código</small>
          <span id="infoCodigo">—</span>
        </div>

        <div class="col-md-3">
          <small class="text-muted d-block">Tipo</small>
          <span id="infoTipo">—</span>
        </div>

        <div class="col-md-3">
          <small class="text-muted d-block">Unidade</small>
          <span id="infoUnidade">—</span>
        </div>

        <div class="col-md-3">
          <small class="text-muted d-block">Fonte</small>
          <span id="infoFonte">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Resultado -->
  <div id="resultadoIndicador" class="card shadow-sm d-none">
    <div class="card-header">
      <strong>Resultado</strong>
    </div>

    <div class="card-body">
      <div id="resultadoNumerico" class="display-4 text-center d-none"></div>

      <div id="resultadoTabela" class="table-responsive d-none"></div>

      <div id="resultadoVazio" class="text-muted text-center d-none">
        Nenhum resultado encontrado.
      </div>
    </div>
  </div>
</div>
{% endblock %}
