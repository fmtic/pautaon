<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando Aprovação de Acesso</title>
    <link href="{{ url_for('static', filename='css/autenticacao/aguardando.css') }}" rel="stylesheet" />
</head>
<body>

    <div class="card">
        <!-- Logo do Sistema (PautaOn) -->
        <div class="system-logo">
            <img src="../static/img/logo_textual_transparente.png" alt="PautaOn - Impacto, Educação, Gestão">
        </div>

        <div class="icon-container">
            <!-- Ícone de Escudo / Checagem -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>

        <div class="status-badge">
            <span class="dot"></span>
            Pendente de validação
        </div>
        
        <p>
            Agora é aguardar a liberação do administrador do sistema para ter acesso à plataforma.
        </p>

        <div class="actions">
            <button onclick="window.location.reload();" class="btn btn-primary">
                Verificar Status Novamente
            </button>
            <a href="/login" class="btn btn-outline">
                Voltar para a Tela de Login
            </a>
        </div>

        <!-- Marca da Empresa (FMtic) -->
        <div class="company-branding">
            <span>Desenvolvido por</span>
            <span></span>FMtic - Transformamos Tecnologia em Soluções Inteligentes</span>
        </div>
    </div>

</body>
</html>
