{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-warning text-dark">
          <h4 class="mb-0">Selecionar oferta para transferir</h4>
        </div>
        <div class="card-body">
          <p>O aluno <strong>{{ aluno.nome }}</strong> está em mais de uma oferta. Escolha qual vínculo será transferido.</p>
          <form method="GET" action="{{ url_for('registros.transferir_aluno', aluno_id=aluno.id) }}">
            <div class="mb-3">
              <label class="form-label" for="inscricao_origem_id">Inscrição de origem</label>
              <select class="form-select" id="inscricao_origem_id" name="inscricao_origem_id" required>
                <option value="">Selecione...</option>
                {% for inscricao in inscricoes %}
                <option value="{{ inscricao.id }}">
                  {{ inscricao.turma.nome }} — {{ inscricao.turma_curso.curso.nome }}{% if inscricao.turma_curso.turno %} · {{ inscricao.turma_curso.turno }}{% endif %}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-warning">Continuar</button>
              <a href="{{ url_for('registros.gerenciar_alunos') }}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
