# alembic.ini - Configuração do Alembic para o projeto pautaon
[alembic]
# Pasta que contém os scripts de migração
script_location = migrations

# Nome do arquivo de configuração da aplicação (usado para obter a URL do BD)
sqlalchemy.url = sqlite:///instance/pautaon.db

# Opções de log (padrão)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
